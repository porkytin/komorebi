source = ~/.config/hypr/mocha.conf

xwayland {
  force_zero_scaling = true
}

###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = app2unit -s a -- alacritty
$menu = app2unit -s a -- fuzzel --launch-prefix='app2unit -s a --fuzzel-compat --'
$fileManager = app2unit -s a -- alacritty -e yazi
$wob_level = app2unit -s a -- /home/martin/.config/hypr/scripts/wob_level.sh

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
exec-once = systemctl --user start shikane.service
exec-once = systemctl --user start waybar.service
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = systemctl --user start hypridle.service

exec-once = app2unit -s a -- seahorse

# maybe turn these into services in the future?
exec-once = app2unit -s b -- wl-paste --type text --watch cliphist store
exec-once = app2unit -s b -- wl-paste --type image --watch cliphist store
exec-once = app2unit -s b -- udiskie &
exec-once = app2unit -s b -- bash /home/martin/.config/hypr/scripts/start_wob.sh &

#############################
### ENVIRONMENT VARIABLES ###
#############################

# Set these in .config/uwsm/env and .config/uwsm/env-hyprland

#####################
### LOOK AND FEEL ###
#####################

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $lavender
    col.inactive_border = $overlay0

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true
    extend_border_grab_area = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
    layout = dwindle

    # Gestures
    gesture = 3, horizontal, workspace
    gesture = 3, up, dispatcher, togglespecialworkspace, S
    gesture = 3, down, dispatcher, togglespecialworkspace, S
}
group {
	col.border_active = $green 
	col.border_inactive = $overlay2
	groupbar{
		font_family = "MesloLGS Nerd Font Mono Bold"
		font_size = 15
		height = 18
		col.active = $green
		text_color = $crust
		col.inactive = $overlay2
		gradients = true
    text_offset = -1
	}
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.3
    dim_special = 0.65

    shadow {
      enabled = false
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true
    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
    animation = specialWorkspaceIn, 1, 4, default, fade
    animation = specialWorkspaceOut, 1, 4, default, fade
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    focus_on_activate = true
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant = altgr-intl

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = ALT # Sets "alt" key as main modifier
$subMod = SUPER

###################################################################################################
# Window management
bind = $mainMod, C, killactive,
bind = $mainMod, F, exec, hyprctl --batch "dispatch togglefloating ; dispatch centerwindow 1"
bind = $mainMod SHIFT, F, centerwindow, 1
bind = $mainMod, M, fullscreen, 1 #monocle
bind = $mainMod SHIFT, M, fullscreen, 0 #true fullscreen (overlays waybar, no borders)
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, Q, togglesplit, # dwindle
bind = $mainMod, G, togglegroup, # tabbedgroup

# TAB switching
bind = $mainMod, Tab, cyclenext,
bind = $mainMod, Tab, bringactivetotop,
bind = $mainMod SHIFT, Tab, cyclenext, prev
bind = $mainMod SHIFT, Tab, bringactivetotop,

# Move focus with mainMod 
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod SHIFT, H, movewindoworgroup, l
bind = $mainMod SHIFT, L, movewindoworgroup, r
bind = $mainMod SHIFT, K, movewindoworgroup, u
bind = $mainMod SHIFT, J, movewindoworgroup, d

# Cycle windows
bind = $mainMod, I, changegroupactive, f
bind = $mainMod SHIFT, I, changegroupactive, b

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, A, togglespecialworkspace, S
bind = $mainMod SHIFT, A, movetoworkspace, special:S

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move/resize windows with mainMod and keyboard
$DELTA_X = 80
$DELTA_Y = 40
bind = $mainMod, minus, resizeactive, -$DELTA_X 0 
bind = $mainMod SHIFT, equal, resizeactive, 0 $DELTA_Y
bind = $mainMod, equal, resizeactive, $DELTA_X 0
bind = $mainMod SHIFT, minus, resizeactive, 0 -$DELTA_Y
# Initial submap binding
bind = $mainMod, Return, submap, window_editor
submap = window_editor
# Bindings within the submap
bind = , minus, resizeactive, -$DELTA_X 0 
bind =  SHIFT, equal, resizeactive, 0 $DELTA_Y
bind = , equal, resizeactive, $DELTA_X 0
bind =  SHIFT, minus, resizeactive, 0 -$DELTA_Y
bind = , H, moveactive, -$DELTA_X 0
bind = , J, moveactive, 0 $DELTA_Y
bind = , K, moveactive, 0 -$DELTA_Y
bind = , L, moveactive, $DELTA_X 0
# Reset to the default submap (important to include this!)
bind = , escape, submap, reset
bind = , Return, submap, reset
bind = $mainMod, Return, submap, reset
submap = reset

###################################################################################################

# Programs and Utilities

bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, U, exec, $menu
bind = $subMod, U, exec, $menu
bind = $mainMod, S, exec, flatpak run --command=io.github.alainm23.planify.quick-add io.github.alainm23.planify
bind = $subMod, D, exec, app2unit -s a -- udiskie-dmenu --dmenu 
bind = $subMod, M, exec, app2unit -s b -- bash -c "hyprctl monitors all > /home/martin/.config/shikane/last_checked_monitors.txt"
bind = $subMod, R, exec, app2unit -s a -- /home/martin/.config/hypr/scripts/fuzzel_window_rules.sh
bind = $subMod, W, exec, app2unit -s a -- /home/martin/.config/hypr/scripts/fuzzel_focus_window.sh
bind = $subMod, P, exec, app2unit -s a -- /home/martin/.config/hypr/scripts/fuzzel_shikane_profile.sh


# Seect from screen (color picker and screenshots)
bind = $subMod, S, submap, screen_select
# Define the submap
submap = screen_select
# Bindings within the submap
bind = , S, exec, app2unit -s a -- hyprshot -m output -o ~/Pictures/screenshots
bind = , S, submap, reset
bind = , W, exec, app2unit -s a -- hyprshot -m window -o ~/Pictures/screenshots
bind = , W, submap, reset
bind = , R, exec, app2unit -s a -- hyprshot -m region -o ~/Pictures/screenshots
bind = , R, submap, reset
bind = , C, exec, app2unit -s a -- hyprpicker | wl-copy
bind = , C, submap, reset
# Reset to the default submap (important to include this!)
bind = , escape, submap, reset
bind = $subMod, S, submap, reset
# Return to the default submap
submap = reset

# clipboard manager
bind = $subMod, v, exec, app2unit -s a -- cliphist list | grep -v '<meta'| fuzzel --dmenu | cliphist decode | wl-copy

# Laptop multimedia keys for volume and LCD brightness

bindel = ,XF86AudioMicMute, exec, app2unit -s b -- wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86AudioMute, exec, $wob_level volume mute
bindel = ,XF86AudioRaiseVolume, exec, $wob_level volume up
bindel = ,XF86AudioLowerVolume, exec, $wob_level volume down
bindel = ,XF86MonBrightnessUp, exec, $wob_level brightness up
bindel = ,XF86MonBrightnessDown, exec, $wob_level brightness down

# Requires playerctl
bindl = , XF86AudioNext, exec, app2unit -s b -- playerctl next
bindl = , XF86AudioPause, exec, app2unit -s b -- playerctl play-pause
bindl = , XF86AudioPlay, exec, app2unit -s b -- playerctl play-pause
bindl = , XF86AudioPrev, exec, app2unit -s b -- playerctl previous

####################################
### WINDOWS RULES AND WORKSPACES ###
####################################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules


windowrule = border_color $mauve, match:workspace s[1]

windowrule = border_color $red, match:fullscreen true

# Ignore maximize requests from apps. You'll probably like this.
windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false


####################################
### WINDOWS RULES ADDED BY SCRIPT ##
####################################
source = ~/.config/hypr/custom_rules.conf
